name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # Paso 1: Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # Paso 2: Autenticar en DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Paso 3: Construir la imagen de Docker
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/eventos-service:latest .

      # Paso 4: Hacer push de la imagen a DockerHub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/eventos-service:latest

      # Paso 5: Configurar credenciales de AWS
      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      # Paso 5.5: Agregar la llave SSH
      - name: Add SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # Paso 6: Conectarse a EC2 y desplegar el microservicio montando AWS EFS
      - name: SSH commands to deploy
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.USER_SERVER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # Autenticar en DockerHub desde EC2
            echo ${{ secrets.DOCKERHUB_TOKEN }} | sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            # Descargar la imagen recién construida
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/eventos-service:latest

            # Asegurar permisos de lectura y escritura en la carpeta EFS
            sudo chmod -R 777 /home/ec2-user/efs

            # Eliminar contenedores previos para evitar conflictos de nombre o puertos
            sudo docker rm -f eventos-service || true
            sudo docker rm -f eventos-efs || true

            # Iniciar el contenedor conectándolo a MySQL y montando el volumen EFS
            sudo docker run -d \
              --name eventos-service \
              --network app-network \
              -p 8081:8081 \
              -v /home/ec2-user/efs:/app/efs \
              -e DB_HOST=mysql-db \
              -e EFS_PATH=/app/efs \
              ${{ secrets.DOCKERHUB_USERNAME }}/eventos-service:latest

            # Esperar arranque de Spring Boot y verificar estado
            sleep 15
            sudo docker ps
            sudo docker logs eventos-service --tail 25
          EOF