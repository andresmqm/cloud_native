spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-db}:3306/eventos_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

# Configuración AWS S3
spring.cloud.aws.region.static=us-east-1
aws.s3.bucket=bucket-sesion1


# Configuración EFS
efs.path=/app/efs

# Seguridad Azure Entra ID (IDaaS)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/TU_TENANT_ID/v2.0
